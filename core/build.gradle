// Plain-JVM logic shared by the phone app and the desktop app: TV discovery, ADB setup, remote link, web APIs, M3U.
plugins { id "org.jetbrains.kotlin.jvm" }

java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
kotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }

dependencies {
    api "dev.mobile:dadb:2.0.0"                       // ADB client over TCP (Apache-2.0)
    api "org.java-websocket:Java-WebSocket:1.5.7"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    compileOnly "org.json:json:20250517"              // Android ships org.json; desktop adds it itself
    testImplementation "org.json:json:20250517"
    testImplementation "org.jetbrains.kotlin:kotlin-test:2.4.21"
}

def versionGenDir = layout.buildDirectory.dir("generated/source/version/kotlin")
def tahoeVersion = project.property("tahoe.version").toString()
def tahoeVersionCode = project.property("tahoe.versionCode").toString().toInteger()

def generateVersion = tasks.register("generateVersion") {
    inputs.property("version", tahoeVersion)
    inputs.property("versionCode", tahoeVersionCode)
    outputs.dir(versionGenDir)
    doLast {
        def out = versionGenDir.get().file("tech/kousozo/tahoetv/core/TahoeVersion.kt").asFile
        out.parentFile.mkdirs()
        out.text = """package tech.kousozo.tahoetv.core

/** Build version constants generated from root gradle.properties. */
object TahoeVersion {
    const val VERSION = "$tahoeVersion"
    const val VERSION_CODE = $tahoeVersionCode
}
"""
    }
}

sourceSets.main.kotlin.srcDir(versionGenDir)
tasks.named("compileKotlin").configure { dependsOn(generateVersion) }

// pass -Dbrand.write=true through to the test JVM (BrandTokensTest regenerates docs/brand/tokens.json)
tasks.named("test") { systemProperty "brand.write", System.getProperty("brand.write", "false"); outputs.upToDateWhen { false } }
