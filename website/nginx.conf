# Inside the Docker image (port 80). Put TLS in front of it (Caddy, Traefik, or nginx + certbot on the host).
server {
    listen 80;
    server_name tahoe.kousozo.tech _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com https://contrib.rocks; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com; frame-ancestors 'none'" always;

    location /assets/ { expires 7d; } # no add_header here: it would drop the security headers above
    location / { try_files $uri $uri/ /index.html; }
}
