plugins { id "com.android.application" }

android {
    namespace "tv.clean.companion"
    compileSdk 36
    packaging { resources { excludes += ["META-INF/*.kotlin_module", "META-INF/versions/**"] } }
    defaultConfig {
        applicationId "tv.clean.companion"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug // personal sideload build
        }
    }
    lint { abortOnError false }
}

dependencies {
    implementation "org.java-websocket:Java-WebSocket:1.5.7"
    implementation "dev.mobile:dadb:2.0.0" // ADB client (Apache-2.0): phone-only TV setup over Wi-Fi
}

// The launcher APK ships inside this app, so setup needs no computer and no download.
def bundled = layout.buildDirectory.dir("generated/tahoeAssets")
tasks.register("bundleLauncher", Copy) {
    dependsOn(":launcher:assembleRelease")
    from(project(":launcher").layout.buildDirectory.file("outputs/apk/release/launcher-release.apk"))
    into(bundled)
    rename { "tahoe-launcher.apk" }
}
android.sourceSets.main.assets.srcDir(bundled)
preBuild.dependsOn("bundleLauncher")
