plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

// Release key (registered in Android Developer Console for tech.kousozo.tahoetv). Falls back to debug when absent.
def ksProps = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace "tech.kousozo.tahoetv"
    compileSdk 36
    packaging { resources { excludes += ["META-INF/*.kotlin_module", "META-INF/versions/**"] } }
    defaultConfig {
        applicationId "tech.kousozo.tahoetv"
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "2.9.0"
    }
    buildFeatures { compose true }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps["storeFile"])
                storePassword ksProps["storePassword"]
                keyAlias ksProps["keyAlias"]
                keyPassword ksProps["keyPassword"]
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint { abortOnError false }
}

kotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.06.00")
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1"
    implementation project(":core")
    implementation "androidx.media3:media3-exoplayer:1.5.1"   // TV Live player (HLS + DASH)
    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1" // TV discovery, ADB setup (dadb), remote link, web APIs
}

// The launcher APK ships inside this app, so setup needs no computer and no download.
def bundled = layout.buildDirectory.dir("generated/tahoeAssets")
tasks.register("bundleLauncher", Copy) {
    dependsOn(":launcher:assembleRelease")
    from(project(":launcher").layout.buildDirectory.file("outputs/apk/release/launcher-release.apk"))
    into(bundled)
    rename { "tahoe-launcher.apk" }
}
android.sourceSets.main.assets.srcDir(bundled)
preBuild.dependsOn("bundleLauncher")
