plugins { id "com.android.application" }

// API keys live in secrets.properties (gitignored); see secrets.example.properties.
def secrets = new Properties()
def sf = rootProject.file("secrets.properties")
// -PpublicBuild: nothing personal compiled in (release APKs); keys are then set from the phone app at runtime.
if (sf.exists() && !project.hasProperty("publicBuild")) sf.withInputStream { secrets.load(it) }
def secret = { String k -> "\"" + (secrets.getProperty(k) ?: "") + "\"" }

// Release key shared with the phone app (keystore.properties, gitignored). Falls back to debug when absent.
def ksProps = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace "tv.clean.home"
    compileSdk 36
    defaultConfig {
        applicationId "tech.kousozo.tahoetv.launcher" // registered in Android Developer Console; classes stay in tv.clean.home
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName "2.9.4"
        buildConfigField "String", "YOUTUBE_API_KEY", secret("youtube.apiKey")
        buildConfigField "String", "GEMINI_API_KEY", secret("gemini.apiKey")
        buildConfigField "String", "TMDB_API_KEY", secret("tmdb.apiKey")
        buildConfigField "String", "GEMINI_MODEL", "\"" + (secrets.getProperty("gemini.model") ?: "gemini-3.5-flash-lite") + "\""
        buildConfigField "String", "HA_URL", secret("homeassistant.url")
        buildConfigField "String", "HA_TOKEN", secret("homeassistant.token")
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps["storeFile"])
                storePassword ksProps["storePassword"]
                keyAlias ksProps["keyAlias"]
                keyPassword ksProps["keyPassword"]
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint { abortOnError false }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"                 // QR codes for pairing
    implementation "org.nanohttpd:nanohttpd-websocket:2.3.1"     // companion server (HTTP + WebSocket)
    // Jadwal TV: channel list / EPG / local-TV logic shared with the phone and desktop apps (ADB/WebSocket clients left out).
    // Watching itself happens in BitTV.
    implementation(project(":core")) { exclude group: "dev.mobile"; exclude group: "org.java-websocket" }
    implementation "androidx.media3:media3-exoplayer:1.5.1"       // built-in Live TV player (HLS + DASH)
    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.5.1"
}
