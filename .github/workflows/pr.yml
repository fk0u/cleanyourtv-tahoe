# Pull-request checks for the JVM modules and both Android apps.
# Release builds stay in desktop.yml (tags only); this runs on every PR.
name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: JVM tests (core, desktop)
        run: ./gradlew --no-daemon -PpublicBuild :core:test :desktop:test
      - name: Compile the Android apps
        run: ./gradlew --no-daemon -PpublicBuild :launcher:assembleDebug :companion:assembleDebug
