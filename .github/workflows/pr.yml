# Pull-request checks for the JVM modules and both Android apps.
# Release builds stay in desktop.yml (tags only); this runs on every PR.
name: PR Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Website bundle check
        run: sh website/build.sh
      - name: JVM tests (core, desktop)
        run: ./gradlew --no-daemon -PpublicBuild :core:test :desktop:test
      - name: Compile and lint the Android apps
        run: ./gradlew --no-daemon -PpublicBuild :launcher:assembleDebug :companion:assembleDebug :launcher:lintDebug :companion:lintDebug

  # A fresh install must start: the 3.8.0 phone app crashed on the last onboarding step after its data was cleared, and
  # nothing in CI opened the app. This installs the debug build on an emulator, clears its data, starts it and lets the
  # system's monkey tap around for a while; any crash of the app fails the job.
  fresh-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build the phone app
        run: ./gradlew --no-daemon -PpublicBuild :companion:assembleDebug
      - name: Start on a clean emulator and exercise it
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r companion/build/outputs/apk/debug/companion-debug.apk
            adb shell pm clear tech.kousozo.tahoetv.dev
            adb logcat -c
            adb shell monkey -p tech.kousozo.tahoetv.dev -c android.intent.category.LAUNCHER --throttle 400 -s 7 --pct-syskeys 0 --pct-appswitch 0 --pct-motion 40 --pct-touch 50 600 | tail -5
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then adb logcat -d | grep -A 25 "FATAL EXCEPTION" | head -60; echo "::error::the app crashed on a fresh install"; exit 1; fi
            echo "no crash"
