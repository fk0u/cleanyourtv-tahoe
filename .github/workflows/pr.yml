# Pull-request checks for the JVM modules and both Android apps.
# Release builds stay in desktop.yml (tags only); this runs on every PR.
name: PR Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Website bundle check
        run: sh website/build.sh
      - name: JVM tests (core, desktop)
        run: ./gradlew --no-daemon -PpublicBuild :core:test :desktop:test
      - name: Compile and lint the Android apps
        run: ./gradlew --no-daemon -PpublicBuild :launcher:assembleDebug :companion:assembleDebug :launcher:lintDebug :companion:lintDebug
