# Multi-platform installers: Desktop (macOS Apple Silicon, macOS Intel, Windows) & Android (Android TV Launcher, Companion App).
# Runs on demand and on version tags; tagged builds are attached to the GitHub release.
name: Multi-platform Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel  # Intel, macOS 13+
            task: packageDmg
            out: desktop/build/compose/binaries/main/dmg/*.dmg
            suffix: macos-intel
          - os: macos-latest    # Apple silicon (arm64)
            task: packageDmg
            out: desktop/build/compose/binaries/main/dmg/*.dmg
            suffix: macos-arm64
          - os: windows-latest
            task: packageMsi
            out: desktop/build/compose/binaries/main/msi/*.msi
            suffix: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build (public, no API keys)
        shell: bash
        run: ./gradlew --no-daemon -PpublicBuild :desktop:${{ matrix.task }}
      - name: Rename
        shell: bash
        run: for f in ${{ matrix.out }}; do mv "$f" "$(dirname "$f")/TahoeTV-${{ matrix.suffix }}.${f##*.}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: TahoeTV-${{ matrix.suffix }}
          path: ${{ matrix.out }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Same release key every time, so installed apps update in place (a throwaway debug key made every release a different signature).
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=tahoetv\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_PASSWORD" > keystore.properties
      - name: Build Android APKs (public, no API keys)
        shell: bash
        run: |
          ./gradlew --no-daemon -PpublicBuild :launcher:assembleRelease :companion:assembleRelease
          mkdir -p dist
          cp launcher/build/outputs/apk/release/launcher-release.apk dist/tahoe-launcher.apk
          cp companion/build/outputs/apk/release/companion-release.apk dist/tahoe-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TahoeTV-android-apks
          path: dist/*.apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
