# Desktop installers: each is built on its own OS (jpackage can't cross-build).
# Runs on demand and on version tags; tagged builds are attached to the GitHub release.
name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13        # Intel, macOS 13+
            task: packageDmg
            out: desktop/build/compose/binaries/main/dmg/*.dmg
            suffix: macos-intel
          - os: macos-14        # Apple silicon
            task: packageDmg
            out: desktop/build/compose/binaries/main/dmg/*.dmg
            suffix: macos-arm64
          - os: windows-latest
            task: packageMsi
            out: desktop/build/compose/binaries/main/msi/*.msi
            suffix: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build (public, no API keys)
        shell: bash
        run: ./gradlew --no-daemon -PpublicBuild :desktop:${{ matrix.task }}
      - name: Rename
        shell: bash
        run: for f in ${{ matrix.out }}; do mv "$f" "$(dirname "$f")/TahoeTV-${{ matrix.suffix }}.${f##*.}"; done
      - uses: actions/upload-artifact@v4
        with: { name: TahoeTV-${{ matrix.suffix }}, path: "${{ matrix.out }}" }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "${{ matrix.out }}" }
