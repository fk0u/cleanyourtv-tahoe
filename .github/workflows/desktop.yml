# Multi-platform installers: Desktop (macOS Apple Silicon, macOS Intel, Windows) & Android (Android TV Launcher, Companion App).
# Runs on demand and on version tags; tagged builds are attached to the GitHub release.
name: Multi-platform Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify release tag matches gradle.properties
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected=$(awk -F= '/^tahoe\.version=/{gsub(/\r/,"",$2); print $2}' gradle.properties)
          actual="${GITHUB_REF_NAME#v}"
          test "$actual" = "$expected" || { echo "::error::Tag $GITHUB_REF_NAME does not match tahoe.version=$expected"; exit 1; }
      - name: JVM tests (core, desktop)
        run: ./gradlew --no-daemon -PpublicBuild :core:test :desktop:test

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel  # Intel, macOS 13+
            task: packageDmg
            out: desktop/build/compose/binaries/main/dmg/*.dmg
            suffix: macos-intel
          - os: macos-latest    # Apple silicon (arm64)
            task: packageDmg
            out: desktop/build/compose/binaries/main/dmg/*.dmg
            suffix: macos-arm64
          - os: windows-latest
            task: packageMsi
            out: desktop/build/compose/binaries/main/msi/*.msi
            suffix: windows
    runs-on: ${{ matrix.os }}
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && 'release' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      # Release signing key so the bundled launcher inside desktop installers is signed with the release key (#92)
      - name: Release signing key
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=tahoetv\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_PASSWORD" > keystore.properties
      - name: Build (public, no API keys)
        shell: bash
        run: ./gradlew --no-daemon -PpublicBuild :desktop:${{ matrix.task }}
      - name: Rename
        shell: bash
        run: for f in ${{ matrix.out }}; do mv "$f" "$(dirname "$f")/TahoeTV-${{ matrix.suffix }}.${f##*.}"; done
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: TahoeTV-${{ matrix.suffix }}
          path: ${{ matrix.out }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: ${{ matrix.out }}

  android:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && 'release' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      # Same release key every time, so installed apps update in place (a throwaway debug key made every release a different signature).
      - name: Release signing key
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=tahoetv\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_PASSWORD" > keystore.properties
      - name: Build Android APKs (public, no API keys)
        shell: bash
        run: |
          ./gradlew --no-daemon -PpublicBuild :launcher:assembleRelease :companion:assembleRelease
          mkdir -p dist
          cp launcher/build/outputs/apk/release/launcher-release.apk dist/tahoe-launcher.apk
          cp companion/build/outputs/apk/release/companion-release.apk dist/tahoe-tv.apk
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: TahoeTV-android-apks
          path: dist/*
      # Release notes = this version's section of CHANGELOG.md (also shown inside the apps).
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " {p = ($2 == v)} p && !/^## /' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Tahoe TV $v" > release-notes.md
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
          body_path: release-notes.md
