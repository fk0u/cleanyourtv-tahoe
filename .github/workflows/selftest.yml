# Runs the packaged desktop app's --selftest on Windows and macOS (the app as users install it, not `gradle run`).
# Desktop bugs that only show in the packaged app on one OS (gzip playlists, status checks, Windows) are caught here.
name: Desktop selftest

on:
  workflow_dispatch:
  push:
    branches: ["windows-*"]

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the packaged app
        shell: bash
        run: ./gradlew --no-daemon -PpublicBuild :desktop:createDistributable
      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse "desktop/build/compose/binaries/main/app" -Filter "Tahoe TV.exe" | Select-Object -First 1
          Write-Host "exe: $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          Write-Host "exit: $($p.ExitCode)"
          exit $p.ExitCode
      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -name "*.app" | head -1)
          code=0; "$app/Contents/MacOS/Tahoe TV" --selftest "$RUNNER_TEMP/selftest.txt" || code=$?
          cat "$RUNNER_TEMP/selftest.txt"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.os }}
          path: ${{ runner.temp }}/selftest.txt
